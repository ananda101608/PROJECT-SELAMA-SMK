<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Website Sekolah</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login-style.css"> 
</head>
<body>
    <div class="login-container">
        <div class="info-side">
            <h1>Selamat Datang!</h1>
            <p>Portal Siswa & Guru. Silakan masuk untuk melanjutkan.</p>
        </div>
        <div class="form-side">
            <form action="beranda.html">
                <h2>Login Akun</h2>
                <div class="input-group">
                    <input type="text" id="username" class="input-field" required>
                    <label for="username" class="input-label">Username atau Email</label>
                </div>
                <div class="input-group">
                    <input type="password" id="password" class="input-field" required>
                    <label for="password" class="input-label">Password</label>
                    <i class="fa-solid fa-eye password-toggle" id="togglePassword"></i>
                </div>
                <div class="options"><a href="#">Lupa Password?</a></div>
                <button type="submit" class="btn-login">Masuk</button>
                <p class="register-link">Belum punya akun? <a href="#">Hubungi Admin</a></p>
            </form>
        </div>
    </div>
    <script>
        document.getElementById('togglePassword').addEventListener('click', function () {
            const password = document.getElementById('password');
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            this.classList.toggle('fa-eye-slash');
        });
    </script>
</body>
</html>
