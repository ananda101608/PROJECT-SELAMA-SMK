<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | Website Sekolah</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
    
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="login-style.css"> 
</head>
<body>

    <div class="login-container">
        
        <div class="info-side">
            <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
              <path fill="#FFC0CB" d="M38.1,-58.8C51.6,-53.4,66.2,-46.8,75.1,-35.3C84,-23.8,87.2,-7.3,83.1,6.5C79,20.3,67.6,31.5,56.9,41.2C46.2,50.9,36.2,59.1,24.8,65.1C13.4,71.1,0.6,74.9,-12.3,73.5C-25.2,72.1,-38.2,65.5,-49.2,56C-60.1,46.5,-69,34.1,-73.2,20.3C-77.4,6.4,-77,-8.9,-70.7,-21.8C-64.4,-34.7,-52.3,-45.2,-39.9,-51.1C-27.4,-57,-14.7,-58.4,-2.8,-58.2C9.1,-58,18.3,-56.2,38.1,-58.8Z" transform="translate(100 100)" />
            </svg>
            <h1>Selamat Datang!</h1>
            <p>Portal Siswa & Guru. Silakan masuk untuk melanjutkan.</p>
        </div>
        
        <div class="form-side">
            <form action="beranda.html">
                <h2>Login Akun</h2>
                
                <div class="input-group">
                    <input type="text" id="username" class="input-field" required>
                    <label for="username" class="input-label">Username atau Email</label>
                </div>
                
                <div class="input-group">
                    <input type="password" id="password" class="input-field" required>
                    <label for="password" class="input-label">Password</label>
                    <i class="fa-solid fa-eye password-toggle" id="togglePassword"></i>
                </div>
                
                <div class="options">
                    <a href="#">Lupa Password?</a>
                </div>
                
                <button type="submit" class="btn-login">Masuk</button>
                
                <p class="register-link">
                    Belum punya akun? <a href="#">Hubungi Admin</a>
                </p>
            </form>
        </div>
        
    </div>

    <script>
        const togglePassword = document.getElementById('togglePassword');
        const password = document.getElementById('password');

        togglePassword.addEventListener('click', function () {
            const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
            password.setAttribute('type', type);
            this.classList.toggle('fa-eye-slash');
        });
    </script>

</body>
</html>
